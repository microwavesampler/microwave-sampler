<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080b10">
  <title>Microwave Sampler Support</title>
  <meta name="description" content="Contact Microwave Sampler support by email.">
  <style>
    :root { color-scheme: dark; background: #080b10; color: #eef2f7; font: 100%/1.65 Arial, Helvetica, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    header { border-bottom: 1px solid #293546; }
    header div, main { width: min(100% - 2.5rem, 44rem); margin-inline: auto; }
    header div { padding-block: 1rem; }
    a { color: #60d9f4; text-underline-offset: .18em; }
    a:focus-visible { outline: 2px solid #d9ff3f; outline-offset: 3px; }
    .brand { color: #eef2f7; font: bold 1rem/1.5 "Courier New", monospace; text-decoration: none; }
    .brand span { color: #60d9f4; }
    main { padding-block: clamp(1.8rem, 6vw, 4rem); }
    h1 { font-size: clamp(2.2rem, 7vw, 3.5rem); line-height: 1.08; letter-spacing: -.04em; margin: 0; }
    h2 { margin: 1.8em 0 .35em; font-size: 1.32rem; line-height: 1.25; }
    p { margin: .55em 0; }
    .date { color: #aebccc; margin: .7em 0 1.6em; }
    address { font-style: normal; overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <header><div><a class="brand" href="./" aria-label="Microwave Sampler homepage">MICROWAVE<span>//</span>SAMPLER</a></div></header>
  <main>
    <h1>Support</h1>
    <p>For help with Microwave Sampler, email <a href="mailto:microwave.sampler@gmail.com">microwave.sampler@gmail.com</a>.</p>
  </main>
</body>
</html>
